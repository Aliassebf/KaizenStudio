repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: python -m ruff check --fix
        language: system
        types: [python]
      - id: pytest-fast
        name: pytest (rapide)
        entry: python -m pytest -q -x tests/test_review_improvements.py
        language: system
        pass_filenames: false
