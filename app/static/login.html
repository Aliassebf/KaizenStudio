<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion — Kaizen Studio</title>
    <link rel="stylesheet" href="/static/styles.css?v=local-auth-1" />
    <style>
      .auth-shell { width: min(440px, calc(100% - 2rem)); margin: 8vh auto; }
      .auth-panel { padding: 1.5rem; background: white; border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); }
      .auth-panel form, .auth-panel label { display: grid; gap: .65rem; }
      .auth-panel form { gap: 1rem; }
      .auth-panel input { padding: .7rem; border: 1px solid var(--border); border-radius: 8px; font: inherit; }
      .auth-panel h1 { margin-top: 0; }
    </style>
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-panel">
        <div class="eyebrow">Kaizen Studio</div>
        <h1>Connexion</h1>
        <form id="loginForm">
          <label>Identifiant<input name="username" autocomplete="username" required autofocus /></label>
          <label>Mot de passe<input name="password" type="password" autocomplete="current-password" required /></label>
          <button type="submit">Se connecter</button>
        </form>
        <p id="authMessage" class="form-message" role="status"></p>
      </section>
    </main>
    <script src="/static/auth-pages.js?v=local-auth-1"></script>
  </body>
</html>
