[project]
name = "kaizen-studio"
version = "0.2.0"
requires-python = ">=3.11,<3.12"
description = "Étude de temps et de mouvements à partir de vidéos — application web locale"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["build", "dist", "wheelhouse", "kaizen_video_study*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S608", "RUF001", "RUF002", "RUF003"]  # assert en tests ; SQL paramétré vérifié ; typographie FR

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
